<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday</title>
  <style>
    /* reset dasar */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      position: relative;
      overflow-x: hidden;
      background-image: url("./backgroundUcapanI.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #111;
    }



    /* konten utama (teks, tombol) */
.content {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding-top: 10px; /* naikkan konten */
}

/* ---------- Overlay teks: sejajar presisi dengan .bg-main ---------- */
/* gunakan lebar yang sama prinsipnya (responsive) supaya selalu align dengan foto */
.typing-text {
  position: fixed;
  left: 50%;
  top: 50%;                        /* center vertikal acuan */
  transform: translate(-50%, -50%);/* center tepat di tengah layar */
  z-index: 30;

  /* width dibuat mengikuti bg-main (max-width sama) */
  width: min(520px, 78vw);         /* gunakan nilai yang sama dengan .bg-main */
  padding: 22px 28px;
  background: rgba(255,255,255,0.86);
  color: #111;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);

  /* pastikan overlay tidak menyetop klik tombol di bawah */
  pointer-events: none;
  line-height: 1.9;
}

/* ---------- Overlay teks: sejajar presisi dengan .bg-main ---------- */
/* gunakan lebar yang sama prinsipnya (responsive) supaya selalu align dengan foto */
.typing-text {
  position: fixed;
  left: 50%;
  top: 50%;                        /* center vertikal acuan */
  transform: translate(-50%, -50%);/* center tepat di tengah layar */
  z-index: 30;

  /* width dibuat mengikuti bg-main (max-width sama) */
  width: min(520px, 78vw);         /* gunakan nilai yang sama dengan .bg-main */
  padding: 22px 28px;
  background: rgba(255,255,255,0.86);
  color: #111;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);

  /* pastikan overlay tidak menyetop klik tombol di bawah */
  pointer-events: none;
  line-height: 1.9;
}

/* kalau ingin overlay sedikit lebih transparan di HP, gunakan media query di bawah */

/* ---------- Tombol Reply: diposisikan tetap di bawah overlay, di tengah ---------- */
/* ---------- Tombol Balas Pesan ---------- */
#whatsapp-button {
  position: fixed;
  left: 50%;
  top: calc(50% + 300px);
  transform: translateX(-50%);

  z-index: 40;
  pointer-events: none;

  background-color: #c80101;
  color: white;
  border: none;
  padding: 12px 22px;
  font-size: 18px;
  border-radius: 8px;

  box-shadow: 0 6px 18px rgba(0,0,0,0.18);

  opacity: 0;
  transition: opacity 0.5s ease;
}

/* Tombol muncul setelah animasi teks selesai */
#whatsapp-button.show {
  opacity: 1;
  pointer-events: auto;
}


/* ---------- Tampilan HP ---------- */
@media (max-width: 900px) {
  .typing-text {
    width: 86vw;
    padding: 16px;
    font-size: 16px;
  }

  #whatsapp-button {
    top: calc(50% + 250px);
    font-size: 15px;
    padding: 10px 18px;
  }
}


@media (max-width: 420px) {
  .typing-text {
    width: 92vw;
    padding: 12px;
    font-size: 14px;
  }

  #whatsapp-button {
    top: calc(50% + 230px);
    font-size: 14px;
    padding: 10px 16px;
  }
}
       
        /* Sembunyikan audio dari tampilan */
        audio {
            display: none; /* Menyembunyikan elemen audio dari tampilan */
        }
    
    </style>
</head>
<body>


  <!-- ===== KONTEN UTAMA ===== -->
  <div class="content">


    <div class="typing-text" id="typing"></div>

    <!-- Audio (autoplay/loop jika ada) -->
    <audio id="background-music" autoplay loop>
      <source src="A thousand years (Sped Up).mp3"
 type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- Tombol WA (muncul setelah teks selesai) -->
    <button id="whatsapp-button" onclick="window.location.href='https://www.instagram.com/ojiiiii___'">Balas pesan <br></button>
  </div>

 <script>
/* Utility delay */
const wait = ms => new Promise(res => setTimeout(res, ms));

(async function typingController(){
  const typingEl = document.getElementById('typing');
  const btn = document.getElementById('whatsapp-button');

  if (!typingEl || !btn) {
    console.warn('Element #typing atau #whatsapp-button tidak ditemukan.');
    return;
  }

  // pastikan tombol tersembunyi di awal
  btn.classList.remove('show');
  btn.style.opacity = 0;
  btn.style.pointerEvents = 'none';

  // Teks yang ingin diketik (sesuaikan jika kamu punya array lain)
  const lines = [
    "Selamat ulang tahun Nuri",
    "Semoga di tahun ini dan ditahun kedepannya",
    "Semua yang kamu harapkan bisa pelan-pelan terwujud",
    "Semoga selalu diberikan kesehatan, kebahagiaan",
    "Dan dimudahkan dalam segala urusan",
    "Oh iya, semangat juga buat skripsinya! Semoga lancar sampai selesai",
    "Jangan putus ditengah jalan yaaa",
    "Jangan lupa traktirannya 😂😂😂",
    "Happy birthday 🎉",
  ];

  const charDelay =80; // delay per karakter (ms)
  const lineDelay =800; // jeda antar baris setelah selesai mengetik (ms)

  // kosongkan area typing dulu
  typingEl.innerHTML = '';

  // fungsi mengetik satu baris per karakter
  async function typeLine(line) {
    const p = document.createElement('p');
    p.textContent = '';          // mulai kosong
    typingEl.appendChild(p);

    for (let i = 0; i < line.length; i++) {
      p.textContent += line[i];
      await wait(charDelay);
    }
  }

  // ketik semua baris berurutan
  for (let i = 0; i < lines.length; i++) {
    await typeLine(lines[i]);
    await wait(lineDelay);
  }

  // semua teks sudah selesai — tampilkan tombol dengan efek
  // pakai class .show (CSS harus sudah punya transisi opacity)
  btn.classList.add('show');
  // fallback: pastikan style juga diubah
  btn.style.opacity = 1;
  btn.style.pointerEvents = 'auto';
}
)
();
</script>
</body>
</html>
